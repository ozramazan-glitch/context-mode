<link rel="stylesheet" href="css/style.css">
<script>
  // Temayı ilk boyamadan önce uygula (Ayarlar'dan seçim yapılmadıysa: Bauhaus Satranç).
  (function () {
    var s = 'bauhaus';
    try { var d = JSON.parse(localStorage.getItem('satranc-akademisi-v1') || 'null'); if (d && d.settings && d.settings.skinPicked && /^(bauhaus|kitap|gece|mermer|saat|kulup)$/.test(d.settings.skin)) s = d.settings.skin; } catch (e) { /* depolama yok */ }
    document.documentElement.setAttribute('data-skin', s);
  })();
</script>

<a class="skip" href="#main">İçeriğe geç</a>
